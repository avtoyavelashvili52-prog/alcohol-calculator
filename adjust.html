<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>სიმაგრის მორგება</title>
    <script>try { var th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <header class="bar">
            <h1 data-b="title"></h1>
            <div class="tools">
                <select id="lang" aria-label="Language">
                    <option value="ka">KA</option>
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                </select>
                <button id="theme" class="icon" type="button"></button>
            </div>
        </header>

        <label for="mode" data-b="modeLabel"></label>
        <select id="mode" class="wide">
            <option value="add" data-b="modeAdd"></option>
            <option value="make" data-b="modeMake"></option>
        </select>

        <label for="amount" data-b="amount"></label>
        <div class="row2">
            <input type="text" inputmode="decimal" id="amount" autocomplete="off" placeholder="100">
            <select id="unit" class="wide">
                <option value="l" data-b="uL"></option>
                <option value="ml" data-b="uMl"></option>
                <option value="kg" data-b="uKg"></option>
                <option value="t" data-b="uT"></option>
            </select>
        </div>

        <div class="row2">
            <div><label for="qa" data-b="strengthA"></label><input type="text" inputmode="decimal" id="qa" autocomplete="off" placeholder="96"></div>
            <div><label for="qb" data-b="strengthB"></label><input type="text" inputmode="decimal" id="qb" autocomplete="off" value="0"></div>
        </div>

        <label for="qt" data-b="target"></label>
        <input type="text" inputmode="decimal" id="qt" autocomplete="off" placeholder="40">

        <button class="go" type="button" onclick="calculateAdjust()" data-b="calc"></button>

        <div id="result-box" class="result-idle">
            <span id="result-text" data-b="waiting"></span>
        </div>

        <p class="note" data-b="note"></p>
        <a class="navlink" href="index.html" data-b="back"></a>
    </main>

    <script src="common.js"></script>
    <script src="alcohol-core.js"></script>
    <script src="blend-core.js"></script>
    <script src="adjust-core.js"></script>
    <script src="site.js"></script>
    <script src="adjust-ui.js"></script>
</body>
</html>
