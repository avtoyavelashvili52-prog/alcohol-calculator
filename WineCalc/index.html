<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIML ლაბორატორიული კალკულატორი</title>
    <script>try { var th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <header class="bar">
            <h1 data-i18n="title"></h1>
            <div class="tools">
                <select id="lang" aria-label="Language">
                    <option value="ka">KA</option>
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                </select>
                <button id="theme" class="icon" type="button"></button>
            </div>
        </header>

        <label for="temp" data-i18n="tempLabel"></label>
        <input type="text" inputmode="decimal" id="temp" autocomplete="off" placeholder="24.5">

        <label for="apparent" data-i18n="readingLabel"></label>
        <input type="text" inputmode="decimal" id="apparent" autocomplete="off" placeholder="15.2">

        <button class="go" type="button" onclick="calculateAlcohol()" data-i18n="calc"></button>

        <div id="result-box" class="result-idle">
            <span id="result-text" data-i18n="waiting"></span>
        </div>

        <p class="note" data-i18n="note"></p>
        <a class="navlink" href="blend.html">კუპაჟი · Купажирование · Blending</a>
        <a class="navlink" href="adjust.html">სიმაგრის მორგება · Нужная крепость · Target strength</a>
    </main>

    <script src="common.js"></script>
    <script src="alcohol-core.js"></script>
    <script src="site.js"></script>
    <script src="alcohol-ui.js"></script>
</body>
</html>
